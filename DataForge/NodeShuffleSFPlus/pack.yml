# v0.2.0 (2026-07-29 hardening pass, Packet A): switched from a full-array REPLACE of
# mAllowedExtractors to per-mod APPEND documents (op: append is a real, shipped KDataForge
# verb -- see KPatchwork's MkPlusSFPlus/PDA/PDA-allowed-extractors.yml, which appends to this
# SAME target+property and is installed+enabled on this profile). Appending means we never pin
# a stale copy of SF+'s own list, and each third-party miner's entry is gated by its OWN
# conditions.hasMod so a profile missing that mod is unaffected instead of the whole document
# no-op'ing. See extractor-allowlist-*.cdo.yml for the documents; this pack.yml's conditions
# are the OUTER gate (both mods present) -- each document ALSO restates the full mod list
# (belt-and-suspenders: whether document conditions AND or OR against the pack-level ones is
# unverified against the live KDataForge runtime, so each document is self-sufficient).
ref: NodeShuffleSFPlus
name: Node Shuffle SatisfactoryPlus Extractor Compat
version: 0.2.0
contributer: mellox
enabled: true
conditions:
  hasMod:
  - SatisfactoryPlus
  - NodeShuffle
