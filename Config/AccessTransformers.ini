[AccessTransformers]
; Subsystem touches node internals (resource/purity overrides, node type),
; pairs and dresses AFGNodeMeshActor (mNodeActor), invalidates the resource
; scanner's cached node clusters (mNodeClustersUpToDate), and re-points
; portable miners (mExtractResourceNode) at respawned new nodes.
Friend=(Class="AFGResourceNode", FriendClass="ANodeShuffleSubsystem")
Friend=(Class="AFGResourceNodeBase", FriendClass="ANodeShuffleSubsystem")
Friend=(Class="AFGNodeMeshActor", FriendClass="ANodeShuffleSubsystem")
Friend=(Class="AFGResourceScanner", FriendClass="ANodeShuffleSubsystem")
Friend=(Class="AFGPortableMiner", FriendClass="ANodeShuffleSubsystem")
; redesign-11: register our spawned nodes into the resource-node MANAGER's mResourceNodes list — the
; registry the Miner Mk1 extractor hologram queries (GetClosestNode over mResourceNodes). Our runtime-
; spawned nodes never auto-join it (the manager builds it from level nodes at world init), so Mk1 snap
; fails even with a vanilla collision byte-match. Friend grant exposes private mResourceNodes.
Friend=(Class="AFGResourceNodeManager", FriendClass="ANodeShuffleSubsystem")
; redesign-19 DIAGNOSTIC: the Mk1 hologram's TrySnapToActor -> 0 on our nodes (detection passes, resource is
; valid), so a PROTECTED acceptance check inside it (CanOccupyResource / IsAllowedOnResource) rejects ours.
; Friend the module so a static helper can call those protected checks and log which one fails.
Friend=(Class="AFGResourceExtractorHologram", FriendClass="FNodeShuffleModule")
; fu1diag-1 DIAGNOSTIC (belt-and-braces): mConstructDisqualifiers (FGHologram.h) is the base-class
; member the FU1 "invalid aim location" investigation reads (the last completed validate's disqualifier
; list -- exactly what the HUD showed). The :19 grant above, on the DERIVED class, should already cover
; it under [class.protected] when accessed through an AFGResourceExtractorHologram*, but this explicit
; grant on the base class removes the language-lawyer risk at zero cost. Member READS only -- no new
; engine calls.
Friend=(Class="AFGHologram", FriendClass="FNodeShuffleModule")
; scanner-7: the hand scanner builds mNodeClusters from ALL resource nodes (ignoring hidden/collision),
; so our hidden originals still form phantom clusters that get the scan PING EFFECT (PlayClusterEffects)
; even after we suppress their map representation. Hook the protected GenerateNodeClusters and strip
; hidden-only clusters from the protected mNodeClusters list at the source, before any consumer reads it.
Friend=(Class="AFGResourceScanner", FriendClass="FNodeShuffleModule")
; polish-9: portable miners spawn at the terrain UNDER our prominent rock (the game's placement trace passes
; through it), burying them. Hook AFGPortableMinerDispenser::Server_SpawnPortableMiner_Implementation to lift
; the spawn point onto the rock surface where the player aimed. The RPC impl is protected -> Friend the module.
Friend=(Class="AFGPortableMinerDispenser", FriendClass="FNodeShuffleModule")
; redesign-22 DIAGNOSTIC: read the Miner's default-extractor restrictions (mRestrictToNodeType,
; mAllowedResourceForms, mOnlyAllowCertainResources, mAllowedResources) to pinpoint which acceptance
; sub-check rejects our custom-subclass node. These are protected on AFGBuildableResourceExtractorBase.
Friend=(Class="AFGBuildableResourceExtractorBase", FriendClass="FNodeShuffleModule")
; playtest-fixes-1 (ghost radiation): hiding an original leaves its radiation emitter registered in
; AFGRadioactivitySubsystem (mSources, keyed by owner). RemoveEmitters is public inline, but the RADFIX
; hadEmitter diagnostic and the NodeShuffle.Here census read the private mSources map to VERIFY the
; owner-is-the-node assumption in-log (if a radioactive original ever logs hadEmitter=0, it broke).
Friend=(Class="AFGRadioactivitySubsystem", FriendClass="ANodeShuffleSubsystem")
; Packet H2 (ns-wells-h2) -- THE ONE NEW GRANT THIS PACKET IS AUTHORIZED TO ADD, and nothing else.
; AFGResourceNodeFrackingSatellite::mCore is a PRIVATE UPROPERTY(EditInstanceOnly) pointer -- it is
; level-authored instance data, it is NOT SaveGame and it is NOT replicated. A satellite we spawn to
; relocate a well therefore has mCore NULL unless we write it, and a satellite RESTORED from the save
; comes back with mCore NULL as well, having already run BeginPlay (which is what registers a
; satellite with its core). With no write access the relocated well dies SILENTLY: the core's
; mSatellites is empty, the Resource Well Pressurizer reports zero satellites, and there is no crash
; and no error anywhere to notice. This grant is what lets us re-establish the link on EVERY load.
; Writes to mCore only; the satellite's other privates are untouched.
Friend=(Class="AFGResourceNodeFrackingSatellite", FriendClass="ANodeShuffleSubsystem")
